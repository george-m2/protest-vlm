[project]
name = "feasibility"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "george-m2", email = "george.m20420@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "ipython>=9.18.1",
    "jupyter>=1.1.1",
    "pillow==13.0.0",
    "tokenizers==0.20.3",
    "torch==2.15.0",
    "torchvision==0.29.2",
    "transformers==4.46.3",
    "accelerate==1.1.1",
    "huggingface-hub==0.30.2",
    "numpy==2.5.4",
    "safetensors==0.8.0",
]

[project.scripts]
feasibility = "feasibility:main"

[build-system]
requires = ["uv_build>=0.12.20,<0.13.0"]
build-backend = "uv_build"
